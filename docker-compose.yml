# Evaluierungsumgebung (Spezifikation NFR-3).
#
# Enthaelt neben Manager und Datenbank auch einen FreeRADIUS-Container, der
# dieselbe Datenbank ueber rlm_sql liest – damit laesst sich die Wirkung von
# Aenderungen unmittelbar mit radtest pruefen.
#
# Fuer den Produktivbetrieb: FRM_SECRET_KEY und FRM_COA_SECRET_KEY setzen,
# Datenbankpasswoerter ersetzen und den Manager hinter einen TLS-Reverse-Proxy
# stellen (Abschnitt 6).

name: freeradius-manager

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MARIADB_DATABASE: ${DB_NAME:-radius}
      MARIADB_USER: ${DB_USER:-radmgr}
      MARIADB_PASSWORD: ${DB_PASSWORD:-radmgr}
      # Vom Init-Skript gelesen; muss zum FreeRADIUS-Dienst unten passen.
      RADIUS_DB_USER: ${RADIUS_DB_USER:-freeradius}
      RADIUS_DB_PASSWORD: ${RADIUS_DB_PASSWORD:-freeradius}
    volumes:
      - db-data:/var/lib/mysql
      # Legt das RADIUS-Schema beim ersten Start an. In einer bestehenden
      # Installation entfaellt dieser Mount.
      - ./docker/radius-schema.sql:/docker-entrypoint-initdb.d/10-radius-schema.sql:ro
      # Eigenes, eng berechtigtes Konto fuer FreeRADIUS (NFR-1). Als Skript,
      # damit dieselben Zugangsdaten wie im FreeRADIUS-Dienst verwendet werden.
      - ./docker/radius-grants.sh:/docker-entrypoint-initdb.d/20-radius-grants.sh:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "127.0.0.1:${DB_PORT:-13306}:3306"

  manager:
    build:
      context: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      FRM_DB_HOST: db
      FRM_DB_NAME: ${DB_NAME:-radius}
      FRM_DB_USER: ${DB_USER:-radmgr}
      FRM_DB_PASSWORD: ${DB_PASSWORD:-radmgr}
      # Ohne Vorgabewerte: fehlende Schluessel fuehren zu einem klaren
      # Startfehler statt zu oeffentlich bekannten Konstanten.
      FRM_SECRET_KEY: ${FRM_SECRET_KEY:?bitte in .env setzen}
      FRM_COA_SECRET_KEY: ${FRM_COA_SECRET_KEY:?bitte in .env setzen}
      # Ohne TLS-Terminierung davor muss das Session-Cookie unsicher gesetzt werden.
      FRM_COOKIE_SECURE: ${FRM_COOKIE_SECURE:-false}
      FRM_ENVIRONMENT: ${FRM_ENVIRONMENT:-development}
      FRM_BOOTSTRAP_ADMIN_USERNAME: ${FRM_BOOTSTRAP_ADMIN_USERNAME:-admin}
      FRM_BOOTSTRAP_ADMIN_PASSWORD: ${FRM_BOOTSTRAP_ADMIN_PASSWORD:-}
      FRM_DEFAULT_MAC_FORMAT: ${FRM_DEFAULT_MAC_FORMAT:-colon_lower}
    env_file:
      # Alle weiteren FRM_-Variablen aus der .env erreichen den Container nur
      # ueber diesen Weg; die Zuweisungen oben setzen lediglich die Vorgaben.
      # Fehlt die Datei, startet der Stapel trotzdem (required: false).
      - path: .env
        required: false
    ports:
      - "${MANAGER_PORT:-8000}:8000"

  freeradius:
    image: freeradius/freeradius-server:3.2.7
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["radiusd", "-f", "-l", "stdout"]
    environment:
      # Eigenes Konto mit Rechten nur auf die RADIUS-Tabellen; der Manager nutzt
      # ein anderes (NFR-1). Die Modulkonfiguration liest sie ueber $$ENV{...}.
      FRM_DB_HOST: db
      FRM_DB_PORT: "3306"
      FRM_DB_NAME: ${DB_NAME:-radius}
      FRM_DB_USER: ${RADIUS_DB_USER:-freeradius}
      FRM_DB_PASSWORD: ${RADIUS_DB_PASSWORD:-freeradius}
    volumes:
      - ./docker/freeradius/mods-enabled-sql:/etc/raddb/mods-enabled/sql:ro
    ports:
      - "${RADIUS_AUTH_PORT:-1812}:1812/udp"
      - "${RADIUS_ACCT_PORT:-1813}:1813/udp"

volumes:
  db-data:
