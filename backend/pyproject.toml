[project]
name = "freeradius-manager"
version = "2026.9.1"
description = "Web-Verwaltung fuer einen bestehenden FreeRADIUS-Server (rlm_sql)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "argon2-cffi>=23.1",
    "pyjwt>=2.9",
    "pyotp>=2.9",
    "cryptography>=43.0",
    "pyrad>=2.4",
    "authlib>=1.3",
    "httpx>=0.27",
    "python-multipart>=0.0.12",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "testcontainers[mysql]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-pymysql",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "BLE"]
# RUF001-003: Gedankenstriche und Umlaute in deutschen Texten sind gewollt.
# B008: FastAPI-Dependencies werden per Default-Argument deklariert.
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: End-to-End-Test gegen einen echten freeradius-Container (pytest -m e2e)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
omit = ["app/main.py", "alembic/*"]
